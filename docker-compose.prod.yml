services:
  db:
    image: postgres:15-alpine
    container_name: horas_academicas_db_prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-horas_academicas}
      - POSTGRES_USER=${DB_USER:-horas_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-horas_user} -d ${DB_NAME:-horas_academicas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horas_academicas_web_prod
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn plataforma.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile /app/logs/access.log --error-logfile /app/logs/error.log"
    volumes:
      # NÃO sincroniza código (usa código da imagem)
      # Apenas dados persistentes:
      - logs_volume:/app/logs
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - backend

  # Nginx para servir arquivos estáticos 
  nginx:
    image: nginx:alpine
    container_name: horas_academicas_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web
    restart: always
    networks:
      - backend

volumes:
  postgres_data_prod:
  logs_volume:
  media_volume:
  static_volume:

networks:
  backend:
    driver: bridge